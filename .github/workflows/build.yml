name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - name: Windows
            platform: windows-latest
            args: ''
            rust_targets: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # 有 tag 推送时自动创建草稿 Release；手动触发时只上传构建产物。
      # 如需 Apple 签名/公证，在仓库 Secrets 配置 APPLE_CERTIFICATE、APPLE_CERTIFICATE_PASSWORD、
      # APPLE_SIGNING_IDENTITY、APPLE_ID、APPLE_PASSWORD、APPLE_TEAM_ID，并在此处传入 env。
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'HOMURA v__VERSION__'
          releaseBody: |
            # HOMURA v__VERSION__

            本地优先的 ACGN 漫画与轻小说阅读器，现已支持 macOS、Windows 与 Linux。
            解析与渲染全部在本地完成，不上传任何文件。

            ## ✨ 功能亮点

            - **格式通吃**：EPUB / KEPUB / CBZ / ZIP / TXT / Markdown，以及整文件夹漫画导入
            - **四种阅读姿势**：单页、双页、日漫右→左、上下条漫
            - **护眼三件套**：白昼 / 暖色护眼 / 夜间模式，搭配蓝、红、绿、紫四色主题
            - **翻页手感**：丝滑平移、柔和淡入、极速无动画，可自由切换
            - **顺手操作**：滚轮翻页、键盘快捷键、全屏沉浸模式
            - **离线可用**：Tailwind 与 JSZip 已内置于应用，断网也能正常阅读

            ## 📦 下载安装

            | 平台 | 安装包 |
            | --- | --- |
            | macOS | `.dmg`（Universal，Apple Silicon + Intel） |
            | Windows | `.msi` 或 NSIS `-setup.exe` |
            | Linux | `.AppImage` / `.deb` / `.rpm` |

            ## 🍎 macOS 首次打开

            当前安装包尚未做 Apple 开发者签名。若系统提示「无法验证开发者」：

            1. 在 Finder 中右键 `HOMURA.app` → **打开**；或
            2. 终端执行：`xattr -cr /Applications/HOMURA.app`

            ## 🛠 从源码构建

            ```bash
            npm install
            npm run build
            ```

            构建产物位于 `src-tauri/target/release/bundle/`。

            ## 📌 说明

            - 书架目前为会话内临时书库，重启应用后需要重新导入文件。
            - 这是 HOMURA 的首个桌面版本，欢迎反馈问题与建议。
          releaseDraft: true
          prerelease: false

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: homura-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error
          retention-days: 14
